import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id "java-library"
}

// Adds the CustomExperiment/Before sources so NullAway runs on them via
// `./gradlew :sample:compileJava`, alongside this module's existing sources.
sourceSets {
    main {
        java {
            srcDir "${rootDir}/CustomExperiment/Before"
        }
    }
}

dependencies {
    annotationProcessor project(":nullaway")
    annotationProcessor project(path: ":sample-library-model")

    api libs.jspecify
    testImplementation libs.junit4
}

tasks.withType(JavaCompile) {
    if (!name.toLowerCase().contains("test")) {
        options.errorprone {
            check("NullAway", CheckSeverity.ERROR)
            option("NullAway:AnnotatedPackages", "com.uber,org.example.app")
            check("JSpecifyUnrecognizedAnnotationLocation", CheckSeverity.WARN)
        }
    }
}
